<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NonStop Points · Board Update · August 2026</title>

<!-- Fonts: Clash Display (headlines) + Satoshi (body) via Fontshare -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&f[]=jetbrains-mono@400,500&display=swap">

<style>
/* ===========================================
   THEME: Modern fintech, deep navy, electric teal, gold
   =========================================== */
:root{
  --stage-bg:#05080f;
  --bg-0:#070c18;
  --bg-1:#0b1326;
  --bg-2:#0f1b35;
  --panel:#101c34;
  --panel-line:rgba(255,255,255,.08);
  --ink:#f3f6fc;
  --ink-soft:#aab6cc;
  --ink-faint:#6c7a96;
  --teal:#2ee6c5;
  --teal-soft:rgba(46,230,197,.14);
  --gold:#f0c061;
  --amber:#ffae57;
  --green:#41d99a;
  --blue:#5aa7ff;
  --red:#ff6f6f;
  --yellow:#ffd24a;

  --font-display:'Clash Display',sans-serif;
  --font-body:'Satoshi',sans-serif;
  --font-mono:'JetBrains Mono',monospace;

  --ease:cubic-bezier(.16,1,.3,1);
  --dur:.7s;

  --pad:96px;
}

*{margin:0;padding:0;box-sizing:border-box;}

/* === FIXED 16:9 STAGE === */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg,#000);}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg,#fff);}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg,#fff);}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1;}
img,video,canvas,svg{max-width:100%;max-height:100%;}
.deck-controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;}
@media print{
  html,body{width:1920px;height:auto;overflow:visible;background:#fff;}
  .deck-viewport{position:static;overflow:visible;background:#fff;}
  .deck-stage{position:static;width:auto;height:auto;transform:none !important;background:none;}
  .slide{position:relative;display:block !important;visibility:visible !important;opacity:1 !important;pointer-events:auto !important;width:1920px;height:1080px;break-after:page;page-break-after:always;}
  .slide:last-child{break-after:auto;page-break-after:auto;}
  .deck-controls{display:none !important;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.2s !important;}
}

/* === SLIDE BASE LOOK === */
.slide{
  background:
    radial-gradient(1200px 700px at 82% -10%, rgba(46,230,197,.10), transparent 60%),
    radial-gradient(1000px 800px at -8% 110%, rgba(90,167,255,.08), transparent 55%),
    linear-gradient(160deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2));
  color:var(--ink);
  font-family:var(--font-body);
  padding:var(--pad);
}
.slide:not(.s-title):not(.s-video):not(.s-q){
  display:flex;flex-direction:column;justify-content:center;
}
.slide::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%,#000,transparent 85%);
}

/* === REVEAL ANIMATIONS === */
.reveal{opacity:0;transform:translateY(34px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);}
.slide.visible .reveal{opacity:1;transform:translateY(0);}
.slide.visible .d1{transition-delay:.08s}.slide.visible .d2{transition-delay:.18s}
.slide.visible .d3{transition-delay:.28s}.slide.visible .d4{transition-delay:.38s}
.slide.visible .d5{transition-delay:.48s}.slide.visible .d6{transition-delay:.58s}
.slide.visible .d7{transition-delay:.68s}.slide.visible .d8{transition-delay:.78s}
.slide.visible .d9{transition-delay:.88s}

/* === SHARED TYPE === */
.eyebrow{font-family:var(--font-mono);font-size:20px;letter-spacing:.42em;text-transform:uppercase;color:var(--teal);font-weight:500;}
.eyebrow .num{color:var(--ink-faint);}
h1.title{font-family:var(--font-display);font-weight:600;font-size:118px;line-height:.98;letter-spacing:-.02em;}
h2.head{font-family:var(--font-display);font-weight:600;font-size:62px;line-height:1.02;letter-spacing:-.015em;}
.lede{font-size:30px;line-height:1.5;color:var(--ink-soft);max-width:1180px;}
.foot{position:absolute;left:var(--pad);right:var(--pad);bottom:46px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:17px;color:var(--ink-faint);letter-spacing:.04em;}
.foot .pg{color:var(--teal);}
.sources{font-family:var(--font-mono);font-size:17px;color:var(--ink-faint);letter-spacing:.02em;}
.sources b{color:var(--teal);font-weight:500;letter-spacing:.2em;margin-right:14px;}
.sources span{color:var(--ink-soft);}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:11px;font-family:var(--font-mono);font-size:18px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:11px 20px;border-radius:999px;border:1px solid var(--panel-line);}
.pill .dot{width:11px;height:11px;border-radius:50%;}
.pill.blocker{color:var(--red);background:rgba(255,111,111,.12);border-color:rgba(255,111,111,.4);}
.pill.blocker .dot{background:var(--red);box-shadow:0 0 14px var(--red);}
.pill.done{color:var(--green);background:rgba(65,217,154,.10);border-color:rgba(65,217,154,.32);}
.pill.done .dot{background:var(--green);box-shadow:0 0 14px var(--green);}
.pill.flight{color:var(--yellow);background:rgba(255,210,74,.12);border-color:rgba(255,210,74,.38);}
.pill.flight .dot{background:var(--yellow);box-shadow:0 0 14px var(--yellow);}

/* generic card */
.card{background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid var(--panel-line);border-radius:18px;padding:30px 32px;backdrop-filter:blur(2px);}
.card h4{font-family:var(--font-mono);font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:13px;}
.card p{font-size:21px;line-height:1.46;color:var(--ink-soft);}
.card.warn h4{color:var(--amber);}
.card.warn{border-color:rgba(255,174,87,.28);}

/* QUESTION slide */
.s-q{display:flex;flex-direction:column;justify-content:center;gap:46px;}
.oneline{font-family:var(--font-display);font-weight:500;font-size:54px;line-height:1.12;letter-spacing:-.015em;max-width:1500px;}
.oneline em{color:var(--teal);font-style:normal;}
.qbox{border-left:5px solid var(--gold);padding:8px 0 8px 38px;}
.qbox .qk{font-family:var(--font-mono);font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
.qbox .qt{font-family:var(--font-display);font-weight:500;font-size:46px;line-height:1.18;letter-spacing:-.01em;}
.qbox .qt b{color:var(--teal);font-weight:600;}

/* THESIS / 4-up */
.four-up{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;}
.four-up .card{padding:20px 24px;position:relative;}
.four-up .card .n{font-family:var(--font-display);font-weight:600;font-size:34px;color:var(--teal);margin-bottom:6px;display:block;}
.four-up .card .t{font-size:23px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.four-up .card p{font-size:19px;line-height:1.4;}
/* key quote bar */
.keyquote{margin-top:18px;border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(240,192,97,.09),transparent 80%);border-radius:0 12px 12px 0;padding:16px 26px;}
.keyquote p{font-size:18px;line-height:1.4;color:var(--ink);font-style:italic;}
.keyquote .qcite{margin-top:8px;font-family:var(--font-mono);font-size:15px;color:var(--gold);letter-spacing:.03em;}
/* hypothesis block */
.prob-card .hyp{margin-top:18px;background:linear-gradient(120deg,rgba(46,230,197,.12),rgba(46,230,197,.03));border:1px solid rgba(46,230,197,.3);border-radius:12px;padding:16px 20px;}
.prob-card .hyp .hk{display:inline-block;font-family:var(--font-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#04221c;background:var(--teal);padding:4px 10px;border-radius:6px;margin-bottom:10px;font-weight:600;}
.prob-card .hyp p{color:var(--ink);font-size:19px;line-height:1.4;}
/* link chips */
.crowd{margin-top:18px;}
.crowd-lead{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);margin-bottom:12px;}
.crowd-links{display:flex;flex-wrap:wrap;gap:9px;}
.clink{font-family:var(--font-mono);font-size:15px;color:var(--teal);text-decoration:none;border:1px solid rgba(46,230,197,.3);border-radius:8px;padding:7px 13px;transition:background .2s,border-color .2s;}
.clink::after{content:" \2197";opacity:.6;}
.clink:hover{background:var(--teal-soft);border-color:var(--teal);}
.crowd-note{margin-top:14px;font-size:19px;color:var(--ink-soft);font-style:italic;}
/* clickable cards */
a.card.link{text-decoration:none;color:inherit;cursor:pointer;transition:border-color .25s var(--ease),transform .25s var(--ease);}
a.card.link:hover{border-color:rgba(46,230,197,.55);transform:translateY(-4px);}
a.card.link::after{content:"\2197";position:absolute;top:22px;right:26px;color:var(--teal);font-size:24px;opacity:.55;}

/* VIDEO / iframe slide */
.s-video{display:flex;align-items:center;justify-content:center;text-align:center;}
.video-stage{display:flex;flex-direction:column;align-items:center;gap:24px;}
.video-stage .vhead{display:flex;flex-direction:column;align-items:center;gap:14px;}
.video-frame{width:1080px;height:608px;border-radius:18px;overflow:hidden;border:1px solid rgba(46,230,197,.3);box-shadow:0 24px 80px rgba(0,0,0,.5),0 0 60px rgba(46,230,197,.12);background:#000;}
.video-frame iframe{width:100%;height:100%;display:block;}
.s-video .meta{font-family:var(--font-mono);font-size:18px;color:var(--ink-faint);letter-spacing:.04em;}

/* === BUILDING BLOCKS / ARCHITECTURE === */
.bb-top{display:flex;justify-content:space-between;align-items:flex-end;}
.bb-legend{display:flex;gap:26px;font-family:var(--font-mono);font-size:17px;color:var(--ink-soft);}
.bb-legend .lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px;vertical-align:middle;}
.arch{margin-top:18px;display:flex;flex-direction:column;}
.arch-entry{align-self:center;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid var(--panel-line);border-radius:999px;padding:9px 22px;font-family:var(--font-mono);font-size:16px;letter-spacing:.08em;color:var(--ink-soft);}
.arch-entry .dotpin{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--blue);}
.arch-down{align-self:center;color:var(--teal);font-size:22px;line-height:1;margin:6px 0;}
.arch-slab{position:relative;border:1px solid var(--panel-line);border-radius:18px;padding:20px 24px 20px 78px;}
.arch-slab.exp{background:linear-gradient(165deg,rgba(46,230,197,.07),rgba(46,230,197,.015));border-color:rgba(46,230,197,.28);}
.arch-slab.found{background:linear-gradient(165deg,rgba(240,192,97,.08),rgba(240,192,97,.015));border-color:rgba(240,192,97,.3);}
.slab-label{position:absolute;left:0;top:0;bottom:0;width:56px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-mono);font-size:14px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;}
.arch-slab.exp .slab-label{color:var(--teal);border-right:1px solid rgba(46,230,197,.25);}
.arch-slab.found .slab-label{color:var(--gold);border-right:1px solid rgba(240,192,97,.28);}
.slab-label small{font-size:11px;letter-spacing:.12em;color:var(--ink-faint);font-weight:400;}
.arch-nodes{display:grid;gap:14px;}
.arch-nodes.n6{grid-template-columns:repeat(3,1fr);}
.arch-nodes.n3{grid-template-columns:repeat(3,1fr);}
.anode{position:relative;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--panel-line);border-radius:12px;padding:14px 16px;}
.anode .an-top{display:flex;align-items:center;gap:11px;}
.anode .an-ico{width:24px;height:24px;flex:none;color:var(--teal);}
.anode .an-ico svg{width:100%;height:100%;display:block;}
.arch-slab.found .an-ico{color:var(--gold);}
.anode .an-name{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);line-height:1;}
.anode .an-vendor{font-size:17px;font-weight:700;color:var(--teal);margin-top:9px;}
.arch-slab.found .an-vendor{color:var(--gold);}
.anode .an-sub{font-size:15px;color:var(--ink-soft);margin-top:3px;line-height:1.3;}
.arch-bridge{display:flex;align-items:center;gap:18px;margin:14px 0;}
.arch-bridge .ln{flex:1;height:0;border-top:2px dashed rgba(255,255,255,.18);}
.arch-bridge .tag{font-family:var(--font-mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;}
.arch-bridge .tag b{color:var(--teal);font-weight:500;}
.arch-base{margin-top:16px;display:flex;align-items:center;gap:14px;justify-content:center;background:linear-gradient(90deg,rgba(46,230,197,.08),rgba(240,192,97,.08));border:1px solid var(--panel-line);border-radius:12px;padding:13px 24px;font-size:17px;color:var(--ink-soft);text-align:center;}
.arch-base b{color:var(--ink);font-weight:700;}

/* stat rows */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:18px 0 8px;}
.stat{background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--panel-line);border-radius:18px;padding:34px 30px;}
.stat .big{font-family:var(--font-display);font-weight:600;font-size:78px;line-height:1;letter-spacing:-.02em;color:var(--teal);}
.stat .big.gold{color:var(--gold);}
.stat .big.red{color:var(--red);}
.stat .lab{font-size:21px;color:var(--ink-soft);margin-top:12px;line-height:1.4;}
.validated{margin-top:18px;font-size:21px;color:var(--ink-soft);border-left:4px solid var(--teal);padding-left:24px;line-height:1.45;}
.chime-bar{margin-top:16px;display:flex;align-items:center;gap:32px;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--panel-line);border-radius:16px;padding:20px 32px;}
.chime-bar .cb-num{font-family:var(--font-display);font-weight:700;font-size:76px;color:var(--teal);line-height:1;flex:none;}
.chime-bar .cb-txt{font-size:20px;line-height:1.45;color:var(--ink-soft);}
.chime-bar .cb-txt b{color:var(--ink);font-weight:700;}

/* stack banner */
.stack-banner{margin-top:18px;text-align:center;background:linear-gradient(90deg,rgba(46,230,197,.12),rgba(240,192,97,.12));border:1px solid rgba(46,230,197,.3);border-radius:14px;padding:18px 28px;font-family:var(--font-display);font-weight:500;font-size:26px;letter-spacing:-.01em;color:var(--ink-soft);}
.stack-banner b{color:var(--teal);font-weight:600;}

/* FINANCE */
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:20px 0;}
.fin-stat{background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--panel-line);border-radius:18px;padding:34px 36px;}
.fin-stat .v{font-family:var(--font-display);font-weight:600;font-size:64px;letter-spacing:-.02em;color:var(--teal);line-height:1;}
.fin-stat .v small{font-size:34px;color:var(--ink-soft);font-weight:500;}
.fin-stat .l{font-size:21px;color:var(--ink-soft);margin-top:14px;line-height:1.42;}

/* interchange waterfall */
.wf{display:flex;flex-direction:column;gap:12px;margin-top:20px;}
.wf-row{display:grid;grid-template-columns:330px 1fr 190px;align-items:center;gap:22px;}
.wf-row .wl{font-family:var(--font-display);font-weight:600;font-size:23px;color:var(--ink);line-height:1.15;}
.wf-row .wl small{display:block;font-family:var(--font-body);font-weight:400;font-size:15px;color:var(--ink-faint);margin-top:3px;}
.wf-track{height:52px;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden;position:relative;}
.wf-fill{height:100%;border-radius:10px;display:flex;align-items:center;padding:0 18px;}
.wf-row .wv{font-family:var(--font-mono);font-size:22px;color:var(--ink);text-align:right;}

/* PLAN two-phase */
.phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px;}
.phase{border-radius:18px;padding:32px 34px;border:1px solid var(--panel-line);background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012));}
.phase .pk{font-family:var(--font-mono);font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);}
.phase .ph{font-family:var(--font-display);font-weight:600;font-size:36px;margin:10px 0 16px;}
.phase.p1 .ph{color:var(--teal);}.phase.p2 .ph{color:var(--gold);}
.phase p{font-size:21px;color:var(--ink-soft);line-height:1.5;}
.gate{margin-top:26px;}
.gate .gk{font-family:var(--font-mono);font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:16px;}
.gate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.gate-cell{background:rgba(46,230,197,.08);border:1px solid rgba(46,230,197,.3);border-radius:14px;padding:22px 22px;text-align:center;}
.gate-cell .gv{font-family:var(--font-display);font-weight:600;font-size:38px;color:var(--teal);line-height:1.1;}
.gate-cell .gl{font-size:18px;color:var(--ink-soft);margin-top:10px;}

/* three-col */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:36px;}

/* APPENDIX */
.apx-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;}
.apx-block h4{font-family:var(--font-mono);font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin-bottom:14px;}
.apx-block p{font-size:21px;color:var(--ink-soft);line-height:1.7;}
.apx-block a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(46,230,197,.3);transition:border-color .2s;}
.apx-block a:hover{border-color:var(--teal);}

.kicker-row{display:flex;align-items:center;gap:22px;margin-bottom:26px;}

/* decorative stick figures */
.stick{position:absolute;top:54px;right:84px;width:104px;height:132px;pointer-events:none;z-index:3;color:var(--teal);opacity:.5;}
.stick svg{width:100%;height:100%;display:block;overflow:visible;stroke-width:3;}
.stick.gold{color:var(--gold);}
.stick.blue{color:var(--blue);}

/* TITLE slide with card image */
.s-title{display:flex;flex-direction:column;justify-content:center;}
.s-title .brandline{display:flex;align-items:center;gap:18px;margin-bottom:40px;}
.logo-mark{width:54px;height:54px;border-radius:14px;background:linear-gradient(140deg,var(--teal),var(--blue));position:relative;box-shadow:0 0 40px rgba(46,230,197,.4);}
.logo-mark::after{content:"";position:absolute;inset:14px;border-radius:50%;border:3px solid var(--bg-0);}
.brandtxt{font-family:var(--font-mono);letter-spacing:.34em;text-transform:uppercase;font-size:20px;color:var(--ink-soft);}
.s-title h1{margin:10px 0 28px;}
.s-title .sub{font-size:34px;color:var(--ink-soft);font-weight:500;}
.s-title .meta{margin-top:54px;font-family:var(--font-mono);font-size:20px;color:var(--ink-faint);letter-spacing:.04em;}
.s-title .accentbar{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold));margin-bottom:34px;}
.s-title.with-card{padding:0;}
.title-cols{display:grid;grid-template-columns:1.05fr 1fr;width:100%;height:100%;}
.title-left{padding:var(--pad);display:flex;flex-direction:column;justify-content:center;}
.title-right{position:relative;overflow:hidden;}
.title-right img{width:100%;height:100%;object-fit:cover;}
.title-right::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-1) 0%,rgba(11,19,38,.35) 22%,transparent 42%);pointer-events:none;}
.title-right::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(5,8,15,.6);z-index:1;pointer-events:none;}
.preparedfor{margin-top:26px;display:inline-flex;align-items:baseline;gap:14px;border:1px dashed rgba(240,192,97,.5);border-radius:12px;padding:14px 22px;background:rgba(240,192,97,.06);}
.preparedfor .pk{font-family:var(--font-mono);font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.preparedfor .pv{font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--ink);}

/* edit affordance */
.edit-hotzone{position:fixed;top:0;left:0;width:80px;height:80px;z-index:10000;cursor:pointer;}
.edit-toggle{position:fixed;top:18px;left:18px;width:46px;height:46px;border-radius:12px;border:1px solid var(--panel-line);background:rgba(16,28,52,.9);color:var(--ink);font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:10001;}
.edit-toggle.show,.edit-toggle.active{opacity:1;pointer-events:auto;}
.edit-toggle.active{border-color:var(--teal);color:var(--teal);}
[contenteditable="true"]{outline:2px dashed rgba(46,230,197,.6);outline-offset:4px;border-radius:4px;}

/* progress dots */
.deck-controls{display:flex;gap:8px;}
.deck-controls .pdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s var(--ease);}
.deck-controls .pdot.on{background:var(--teal);width:26px;border-radius:5px;}

/* === LOGO CHIPS === */
.logos{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.lchip{display:inline-flex;align-items:center;gap:11px;background:rgba(255,255,255,.055);border:1px solid var(--panel-line);border-radius:12px;padding:10px 16px;}
.lchip img{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;flex:none;}
.lchip span{font-family:var(--font-display);font-weight:600;font-size:21px;color:var(--ink);line-height:1;}
.lchip small{font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;}
.lchip.sm{padding:8px 14px;}.lchip.sm img{width:22px;height:22px;}.lchip.sm span{font-size:18px;}
.lchip.xs{padding:6px 12px;border-radius:10px;}.lchip.xs img{width:19px;height:19px;}.lchip.xs span{font-size:16px;}.lchip.xs small{font-size:12px;}

/* === BANK CARDS (slide 02) === */
.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.bankcard{background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.014));border:1px solid var(--panel-line);border-radius:18px;padding:24px 26px;}
.bc-top{display:flex;align-items:center;gap:16px;}
.bc-logo{width:52px;height:52px;border-radius:12px;background:#fff;object-fit:contain;padding:5px;flex:none;}
.bc-name{font-family:var(--font-display);font-weight:600;font-size:32px;color:var(--ink);line-height:1;}
.bc-sub{font-family:var(--font-mono);font-size:15px;color:var(--ink-faint);margin-top:7px;letter-spacing:.03em;}
.bc-body{font-size:20px;line-height:1.45;color:var(--ink-soft);margin-top:16px;}
.stat.sm{padding:22px 24px;}
.stat.sm .big{font-size:56px;}
.stat.sm .lab{font-size:18px;margin-top:8px;}

/* === BULLET LISTS === */
.bl{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:9px;}
.bl li{position:relative;padding-left:22px;font-size:19px;line-height:1.35;color:var(--ink-soft);}
.bl li::before{content:"\25B8";position:absolute;left:0;top:0;color:var(--teal);font-size:17px;}
.bl li b{color:var(--ink);font-weight:700;}
.bl.tight li{font-size:18px;gap:7px;}
.bl.big li{font-size:22px;line-height:1.35;}
.four-up .card .bl li{font-size:18px;}
.half .bl li,.channel .bl li{font-size:18px;}
.gold-b .bl li::before{color:var(--gold);}

/* === PARTNER ROW (slide 02) === */
.partner-row{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:18px;}
.pr-block{background:linear-gradient(165deg,rgba(255,255,255,.045),rgba(255,255,255,.012));border:1px solid var(--panel-line);border-radius:16px;padding:18px 22px;}
.pr-head{display:flex;align-items:center;gap:13px;}
.pr-head img{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:4px;flex:none;}
.pr-ico{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:rgba(46,230,197,.16);color:var(--teal);font-size:21px;flex:none;}
.pr-head > div > b{display:block;font-family:var(--font-display);font-weight:600;font-size:25px;color:var(--ink);line-height:1.05;}
.pr-head > div > span{display:block;font-family:var(--font-mono);font-size:14px;color:var(--ink-faint);margin-top:6px;letter-spacing:.03em;}
.pr-head .pill{font-size:15px;padding:8px 15px;line-height:1;align-self:center;}
.pr-head .pill .dot{width:10px;height:10px;}
.pr-block p{font-size:18px;line-height:1.45;color:var(--ink-soft);margin-top:13px;}

/* === PROOF STRIP (slide 03) === */
.proof-strip{margin-top:16px;}
.ps-lab{font-family:var(--font-mono);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:12px;}
.ps-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.ps-img{position:relative;display:block;height:164px;border-radius:14px;overflow:hidden;border:1px solid rgba(46,230,197,.28);background:#000;transition:border-color .25s var(--ease),transform .25s var(--ease);}
.ps-img img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.ps-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(to top,rgba(7,12,24,.96),transparent);pointer-events:none;}
.ps-img:hover{border-color:var(--teal);transform:translateY(-3px);}

/* === TWO HALVES (slide 04) === */
.halves{display:grid;grid-template-columns:1fr .62fr 1fr;gap:18px;align-items:stretch;margin-top:18px;}
.half{background:linear-gradient(165deg,rgba(46,230,197,.07),rgba(46,230,197,.014));border:1px solid rgba(46,230,197,.26);border-radius:18px;padding:22px 24px;}
.half.gold{background:linear-gradient(165deg,rgba(240,192,97,.08),rgba(240,192,97,.014));border-color:rgba(240,192,97,.3);}
.hh{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.hlogo{width:46px;height:46px;border-radius:11px;background:#fff;object-fit:contain;padding:5px;flex:none;}
.hname{font-family:var(--font-display);font-weight:600;font-size:27px;color:var(--ink);line-height:1;}
.hrole{font-family:var(--font-mono);font-size:14px;color:var(--ink-faint);margin-top:6px;letter-spacing:.06em;text-transform:uppercase;}
.half p{font-size:19px;line-height:1.45;color:var(--ink-soft);}
.half-core{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.hc-ring{width:132px;height:132px;border-radius:50%;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,rgba(46,230,197,.18),transparent 70%);box-shadow:0 0 50px rgba(46,230,197,.22);}
.hc-ring span{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);line-height:1.15;}
.hc-txt{font-family:var(--font-mono);font-size:14px;line-height:1.7;color:var(--ink-faint);text-align:center;letter-spacing:.04em;}

/* === UX GRID (slide 05) === */
.ux-grid{display:grid;grid-template-columns:330px 1fr;gap:28px;align-items:start;}
.ux-phone{border-radius:22px;overflow:hidden;filter:drop-shadow(0 24px 60px rgba(0,0,0,.55));}
.ux-phone svg{width:100%;height:auto;display:block;}
.ux-side{display:flex;flex-direction:column;gap:16px;}
.ux-side .phase{padding:22px 26px;}
.ux-side .phase .ph{font-size:30px;margin:8px 0 12px;}
.ux-side .phase p{font-size:19px;line-height:1.45;}

/* === DEFECTION ROW (slide 06) === */
.defect{display:flex;align-items:center;gap:22px;background:linear-gradient(90deg,rgba(255,111,111,.10),transparent 85%);border:1px solid rgba(255,111,111,.26);border-radius:16px;padding:18px 24px;margin-top:18px;}
.df-lab{font-family:var(--font-mono);font-size:15px;letter-spacing:.13em;text-transform:uppercase;color:var(--red);flex:none;max-width:270px;line-height:1.5;}
.df-arrow{margin-left:auto;font-family:var(--font-mono);font-size:15px;color:var(--ink-soft);letter-spacing:.06em;flex:none;}

/* === CHANNEL CARDS (slide 07) === */
.channel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.channel{background:linear-gradient(165deg,rgba(46,230,197,.07),rgba(255,255,255,.014));border:1px solid rgba(46,230,197,.26);border-radius:18px;padding:24px 26px;}
.channel.gold{background:linear-gradient(165deg,rgba(240,192,97,.08),rgba(255,255,255,.014));border-color:rgba(240,192,97,.3);}
.channel.blue{background:linear-gradient(165deg,rgba(90,167,255,.08),rgba(255,255,255,.014));border-color:rgba(90,167,255,.3);}
.ch-logo{width:48px;height:48px;border-radius:11px;background:#fff;object-fit:contain;padding:5px;margin-bottom:14px;}
.ch-num{font-family:var(--font-display);font-weight:600;font-size:56px;line-height:1;color:var(--teal);letter-spacing:-.02em;}
.channel.gold .ch-num{color:var(--gold);}
.channel.blue .ch-num{color:var(--blue);font-size:42px;}
.ch-name{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--ink);margin:10px 0 10px;}
.channel p{font-size:18px;line-height:1.42;color:var(--ink-soft);margin-bottom:14px;}

/* === INCUMBENTS (slide 08) === */
.incumbent{margin-top:14px;border:1px solid var(--panel-line);border-radius:16px;padding:18px 22px;background:linear-gradient(165deg,rgba(255,255,255,.04),rgba(255,255,255,.01));}
.inc-lab{font-family:var(--font-mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px;}
.inc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.inc-item{display:flex;align-items:center;gap:13px;}
.inc-item img{width:34px;height:34px;border-radius:8px;background:#fff;object-fit:contain;padding:4px;flex:none;}
.inc-item b{display:block;font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--ink);line-height:1.1;}
.inc-item span{display:block;font-size:16px;color:var(--ink-soft);margin-top:4px;line-height:1.3;}
.inc-none{margin-top:14px;padding-top:13px;border-top:1px solid var(--panel-line);font-size:19px;color:var(--red);font-weight:500;}

/* === ECON GRID (slide 09) === */
.econ-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px;}
.econ-grid .fin-stat{padding:22px 24px;}
.econ-grid .fin-stat.gold .v{color:var(--gold);}
.es-top{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.es-top img{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;}
.es-top span{font-family:var(--font-mono);font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);}
.es-ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:rgba(46,230,197,.16);color:var(--teal);font-size:15px;}
.econ-grid .fin-stat .v{font-size:52px;}
.econ-grid .fin-stat .v small{font-size:24px;}
.econ-grid .fin-stat .l{font-size:18px;margin-top:12px;}

/* === ROADMAP LOGOS (slide 10) === */
.an-logo{width:22px;height:22px;border-radius:5px;background:#fff;object-fit:contain;padding:2px;flex:none;}

/* === REPORT CARDS (slide 11) === */
.rep-top{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.rep-top img{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;padding:2px;}
.closing-logos{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;}

/* === PASSWORD GATE === */
.gate-screen{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-body);color:var(--ink);
  background:radial-gradient(1000px 700px at 70% -10%,rgba(46,230,197,.10),transparent 60%),linear-gradient(160deg,#070c18,#0b1326 55%,#0f1b35);}
.gate-box{width:580px;padding:44px 46px;border-radius:22px;border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.014));box-shadow:0 30px 90px rgba(0,0,0,.6);}
.gate-brand{display:flex;align-items:center;gap:16px;margin-bottom:30px;}
.gate-brand .logo-mark{width:44px;height:44px;}
.gate-brand span{font-family:var(--font-mono);letter-spacing:.3em;text-transform:uppercase;font-size:16px;color:var(--ink-soft);}
.gate-box h2{font-family:var(--font-display);font-weight:600;font-size:38px;color:var(--ink);letter-spacing:-.01em;line-height:1.1;}
.gate-box p{font-size:18px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}
.gate-form{display:flex;gap:12px;margin-top:28px;}
.gate-form input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:15px 18px;font-family:var(--font-body);font-size:19px;color:var(--ink);outline:none;transition:border-color .2s;}
.gate-form input:focus{border-color:var(--teal);}
.gate-form button{background:var(--teal);color:#04221c;border:none;border-radius:12px;padding:15px 26px;
  font-family:var(--font-display);font-weight:600;font-size:19px;cursor:pointer;transition:transform .15s,box-shadow .2s;}
.gate-form button:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(46,230,197,.3);}
.gate-form button:disabled{opacity:.5;cursor:wait;transform:none;}
.gate-msg{margin-top:16px;font-family:var(--font-mono);font-size:15px;color:var(--red);min-height:20px;letter-spacing:.02em;}
.gate-foot{margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);
  font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);letter-spacing:.06em;}

    <p>Board update, August 2026. This deck is confidential. Enter the passphrase to continue.</p>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <input type="password" id="gatePw" placeholder="Passphrase" autocomplete="off" autofocus>
      <button type="submit" id="gateBtn">Open</button>
    </form>
    <div class="gate-msg" id="gateMsg"></div>
    <div class="gate-foot">Arrow keys or swipe to navigate &nbsp;·&nbsp; Press E to edit</div>
  </div>
</div>

<main class="deck-stage" id="deckStage"></main>
</div>

<div class="edit-hotzone" style="display:none;"></div>

async function unlock(pw){
  const enc=new TextEncoder();
  const mat=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(PAYLOAD.s),iterations:PAYLOAD.n,hash:'SHA-256'},
    mat,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAYLOAD.i)},key,b64d(PAYLOAD.c));
  return new TextDecoder().decode(pt);
}
function logoFallback(){
  document.querySelectorAll('.slide img[data-mono]').forEach(img=>{
    const swap=()=>{
      if(img.dataset.swapped)return; img.dataset.swapped='1';
      const m=img.dataset.mono, tone=img.dataset.tone||'#2ee6c5';
      const fs=m.length>2?22:(m.length>1?26:36);
      const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'+
        '<rect width="64" height="64" rx="15" fill="'+tone+'"/>'+
        '<text x="32" y="'+(32+fs/3)+'" font-family="Helvetica,Arial,sans-serif" font-size="'+fs+
        '" font-weight="700" text-anchor="middle" fill="#06121f">'+m+'</text></svg>';
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      img.style.background='transparent'; img.style.padding='0';
    };
    img.addEventListener('error',swap);
    if(img.complete&&img.naturalWidth===0)swap();
  });
}
const gForm=document.getElementById('gateForm'),gPw=document.getElementById('gatePw'),
      gMsg=document.getElementById('gateMsg'),gBtn=document.getElementById('gateBtn');
gForm.addEventListener('submit',async e=>{
  e.preventDefault();
  gMsg.textContent='';gBtn.disabled=true;gBtn.textContent='Opening\u2026';
  try{
    const html=await unlock(gPw.value);
    document.getElementById('deckStage').innerHTML=html;
    document.getElementById('gateScreen').remove();
    document.getElementById('deckViewport').style.display='';
    document.getElementById('dots').style.display='';
    document.querySelector('.edit-hotzone').style.display='';
    logoFallback();
    bootDeck();
  }catch(err){
    gBtn.disabled=false;gBtn.textContent='Open';
    gMsg.textContent=window.crypto&&window.crypto.subtle?'Incorrect passphrase.':'This browser blocked decryption. Open over https or use the PDF.';
    gPw.value='';gPw.focus();
  }
});
</script>

<script>
/* === SLIDE CONTROLLER === */
class SlidePresentation{
  constructor(){
    this.slides=[...document.querySelectorAll('.slide')];
    this.i=0;
    this.stage=document.getElementById('deckStage');
    this.buildDots();
    this.scale();
    window.addEventListener('resize',()=>this.scale());
    this.keys();this.touch();this.wheel();
    this.show(0);
  }
  scale(){
    const f=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    const x=(window.innerWidth-1920*f)/2,y=(window.innerHeight-1080*f)/2;
    this.stage.style.transform=`translate(${x}px,${y}px) scale(${f})`;
  }
  buildDots(){
    const n=document.getElementById('dots');
    this.slides.forEach((_,k)=>{const d=document.createElement('span');d.className='pdot';d.onclick=()=>this.show(k);n.appendChild(d);});
    this.dots=[...n.children];
  }
  show(k){
    this.i=Math.max(0,Math.min(k,this.slides.length-1));
    this.slides.forEach((s,j)=>{s.classList.toggle('active',j===this.i);s.classList.toggle('visible',j===this.i);});
    this.dots.forEach((d,j)=>d.classList.toggle('on',j===this.i));
  }
  next(){this.show(this.i+1);}prev(){this.show(this.i-1);}
  keys(){document.addEventListener('keydown',e=>{
    if(e.target.getAttribute('contenteditable'))return;
    if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();this.next();}
    if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();this.prev();}
    if(e.key==='Home')this.show(0);if(e.key==='End')this.show(this.slides.length-1);
  });}
  touch(){let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
    addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50){dx<0?this.next():this.prev();}x0=null;},{passive:true});}
  wheel(){let lock=false;addEventListener('wheel',e=>{if(lock)return;if(Math.abs(e.deltaY)<20&&Math.abs(e.deltaX)<20)return;lock=true;(e.deltaY>0||e.deltaX>0)?this.next():this.prev();setTimeout(()=>lock=false,650);},{passive:true});}
}
let deck=null;

/* === INLINE EDITING === */
const editor={isActive:false,
  toggleEditMode(){this.isActive=!this.isActive;const t=document.getElementById('editToggle');t.classList.toggle('active',this.isActive);
    document.querySelectorAll('h1,h2,h3,h4,p,span,.nt,.gl,.wname,.ttl,.desc,.lab,.t,.pv').forEach(el=>{el.contentEditable=this.isActive;});
    if(!this.isActive)t.classList.remove('show');
  }};
function bootDeck(){deck=new SlidePresentation();document.getElementById('editToggle').addEventListener('click',()=>editor.toggleEditMode());wireEdit();}
function wireEdit(){
const hz=document.querySelector('.edit-hotzone'),et=document.getElementById('editToggle');let ht=null;
hz.addEventListener('mouseenter',()=>{clearTimeout(ht);et.classList.add('show');});
hz.addEventListener('mouseleave',()=>{ht=setTimeout(()=>{if(!editor.isActive)et.classList.remove('show');},400);});
et.addEventListener('mouseenter',()=>clearTimeout(ht));
et.addEventListener('mouseleave',()=>{ht=setTimeout(()=>{if(!editor.isActive)et.classList.remove('show');},400);});
hz.addEventListener('click',()=>editor.toggleEditMode());
document.addEventListener('keydown',e=>{if((e.key==='e'||e.key==='E')&&!e.target.getAttribute('contenteditable'))editor.toggleEditMode();});
}
</script>
